# Cloudflared Proxy Configuration Example
# Viper supports multiple formats: YAML, JSON, TOML, HCL, INI, envfile, and Java properties
# Copy this file to ~/.config/cloudflared-proxy/config.yaml and modify as needed

# IP address the proxies listen on (optional, defaults to 127.0.0.1).
# Applies to every proxy that does not set its own "listen". Must be an IP
# literal, not a hostname. The --listen flag overrides this and any per-proxy value.
# listen: 127.0.0.1

# Log level: debug, info, warn or error (optional, defaults to info) and log
# format: text or json (optional, defaults to text).
# logLevel: info
# logFormat: text

proxies:
    # Destination hostname to proxy (required)
  - hostname: "example.your-domain.com"
    # Local port to proxy (optional, defaults to 8888)
    localPort: 8888
    # Destination port to proxy (optional, defaults to 443)
    destinationPort: 443
    # Skip TLS verification (optional, defaults to false)
    # The --skip-tls flag, when set, overrides this value for every proxy.
    skipTLS: false
    # IP address to listen on for this proxy (optional, overrides the top-level "listen")
    # listen: 127.0.0.1
