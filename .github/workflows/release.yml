name: release

on:
  push:
   tags:
     - '*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pkgsite:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: pkg-go-dev
    permissions: {}
    steps:
      - name: Refresh pkg.go.dev
        env:
          MODULE: github.com/sbldevnet/cloudflared-proxy
          VERSION: ${{ github.ref_name }}
        run: |
          curl -fsS "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info"
          curl -fsS -X POST "https://pkg.go.dev/fetch/${MODULE}@${VERSION}"
